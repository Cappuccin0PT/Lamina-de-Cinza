name: Gerar exe para Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Gerar exe
        run: npm run dist
      - name: Guardar os exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: lamina-de-cinza-windows
          path: dist/*.exe
      - name: Publicar release (só com tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
